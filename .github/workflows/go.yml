# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test-check:
    timeout-minutes: 135
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      # Default is true, cancels jobs for other platforms in the matrix if one fails
      fail-fast: false
      matrix:
        go-version:
          - "1.26"
        urlTemplate:
          - "https://github.com/caddyserver/xcaddy/releases/download/{{version}}/xcaddy_{{rawVersion}}_linux_amd64.tar.gz"
        name:
          - "xcaddy"
        pathInArchive:
          - "xcaddy"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v6
      with:
        check-latest: true
        cache: false
        go-version: ${{ matrix.go-version }}

    - name: Restore Go cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: setup-go-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}

    - name: Set up xcaddy
      uses: engineerd/configurator@v0.0.10
      with:
        name: ${{ matrix.name }}
        pathInArchive: ${{ matrix.pathInArchive }}
        fromGitHubReleases: "true"
        repo: "caddyserver/xcaddy"
        version: "latest"
        urlTemplate: ${{ matrix.urlTemplate }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run: |
        xcaddy build master --output ${{ runner.temp }}/${{ matrix.name }} --with github.com/mholt/caddy-l4=./
        # smoking test
        echo ''
        echo '########'
        echo "# ${{ runner.temp }}/${{ matrix.name }} version"
        ${{ runner.temp }}/${{ matrix.name }} version
        echo '########'
        echo ''
        echo '########'
        echo "# ${{ runner.temp }}/${{ matrix.name }} list-modules"
        ${{ runner.temp }}/${{ matrix.name }} list-modules
        echo '########'
        echo ''
        echo '########'
        echo "# ${{ runner.temp }}/${{ matrix.name }} build-info"
        ${{ runner.temp }}/${{ matrix.name }} build-info
        echo '########'

    - name: Test
      run: |
        # TODO:
        # github.com/mholt/caddy-l4,
        # modules/l4echo,
        # modules/l4postgres,
        # modules/l4ssh,
        # modules/l4subroute,
        # modules/l4tee,
        # modules/l4throttle,
        # modules/l4tls,
        # modules/l4xmpp needs their test files.

        go test -v ./...

    - name: Save Go cache
      if: ${{ success() && (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: setup-go-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
